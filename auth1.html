<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>auth1</title>
</head>
<body>
    <div class="login-container">
        <div class="image-box">
            <img src="images/auth photo.png" alt="Egypt">
        </div>
        <div class="login-box">
            <div class="logo">
            <div class="logo-auth-div"><i class="fa-solid fa-bus-side fa-xs" style="color: rgb(255, 255, 255);"></i></div>
            <div class="header-text"><p class="text-rih">Rih</p><p class="text-la">la<br><p class="small-text-header">EGYPT TRAVEL</p></div>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">
                Sign in to your account to continue your journey
            </p>
            <form>
                <label>Email Address</label>
                <input type="email" placeholder="name@gmail.com">
                <label>Password</label>
                <div class="password">
                    <input type="password" placeholder="••••••••">
                    <span>◉</span>
                </div>
                <div class="options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <a class="btn-login" href="auth2.html" target="_blank">Login</a>
                <div class="or">
                    <span></span>
                    <p>Or continue with</p>
                    <span></span>
                </div>
                <div class="social">
                    <a href="#">
                        <span>G</span>Google
                    </a>
                    <a href="#">
                        <span><i class="fa-brands fa-apple fa-sm" style="color: rgb(0, 0, 0);"></i></span>Apple
                    </a>
                </div>
                <p class="create">
                    Don't have an account?
                    <a href="#">Create account</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
